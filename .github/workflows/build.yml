name: build

on:
  push:
  pull_request:

jobs:
  Building:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # https://github.com/actions/virtual-environments#available-environments
        # TODO: macos-13 should be macos-latest, once arm builds are supported
        # TODO: windows-latest has link errors with `__imp_vsprintf_s`
        os: [ubuntu-latest, macos-13]
    steps:
      - name: Checkout out source code
        uses: actions/checkout@v4

      - if: startsWith(matrix.os,'ubuntu')
        name: Install Linux Dependencies
        run: |
          sudo apt-get --allow-releaseinfo-change update
          sudo apt-get install -y libgtk-3-dev
      - name: Set up Go environment
        uses: actions/setup-go@v5
        with:
          go-version: 1.25.x
        id: go

      - name: run go get
        run: go get -v -t ./...
      - name: build
        run: |
            go build -v ./examples/controlgallery.go
            go build -v ./examples/drawtext.go
            go build -v ./examples/histogram.go
            go build -v ./examples/table.go
            go build -v ./examples/updateui.go
